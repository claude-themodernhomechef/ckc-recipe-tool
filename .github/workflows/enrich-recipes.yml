name: Enrich YES Recipes

on:
  schedule:
    - cron: '0 */3 * * *'   # Every 3 hours
  workflow_dispatch:          # Manual trigger from GitHub UI

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 90       # Pipeline can be slow — scraping + Claude API calls

    permissions:
      contents: write         # Needed to commit needs_review.csv updates

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install anthropic firebase-admin requests beautifulsoup4

      - name: Write Firebase service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > service-account.json

      - name: Run enrichment pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 process_new_yes_recipes.py

      - name: Clean up service account file
        if: always()
        run: rm -f service-account.json

      - name: Commit needs_review.csv if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add needs_review.csv process_new_progress.json || true
          git diff --staged --quiet || (
            git commit -m "chore: enrichment run — needs_review updates $(date +%Y-%m-%d)"
            git push
          )
