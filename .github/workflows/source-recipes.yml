name: Daily Recipe Sourcing

on:
  schedule:
    - cron: '0 9 * * *'   # Every day at 9am UTC
  workflow_dispatch:        # Manual trigger from GitHub UI

jobs:
  source-recipes:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write       # needed to commit urls.txt

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Install script dependencies
        run: cd scripts && npm install --omit=dev

      - name: Run recipe sourcing agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          claude --dangerously-skip-permissions -p "
          You are the CKC Recipe Sourcing Agent. Your working directory is the repo root.

          Step 1: Read all four instruction files in .claude/agent/:
            - instructions.md
            - diet-compliance-rules.md
            - blog-scores.md
            - approved-sources.md

          Step 2: Read urls.txt (one URL per line) to get all existing URLs — use this for duplicate checking.

          Step 3: Find exactly 10 new recipes following the instructions exactly.
            - Crawl 2-3 Tier 1/2 approved sources
            - Run at least 2 open web searches
            - Visit each recipe page and read the full ingredient list
            - Fill all fields for every recipe
            - Apply GF and DF tags proactively from ingredients — do not wait for the blogger to label them
            - Balance protein types and cuisine styles

          Step 4: After every 5 recipes researched, write them to Firestore using:
            node scripts/add_recipe_to_firestore.js '<JSON>'
          See instructions.md Step 4 for the exact JSON format and field names.
          Run the script once per recipe — do not batch. Check the exit code.

          Do not modify existing rows in any CSV. Do not push to GitHub.
          "

      - name: Commit updated urls.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add urls.txt
          git diff --staged --quiet || (
            git commit -m "chore: update urls.txt — sourcing run $(date +%Y-%m-%d)"
            git push
          )
