name: Weekly Recipe Sourcing

on:
  schedule:
    - cron: '0 9 * * 5'   # Every Friday at 9am UTC
  workflow_dispatch:        # Manual trigger from GitHub UI

jobs:
  source-recipes:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run recipe sourcing agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude --dangerously-skip-permissions -p "
          You are the CKC Recipe Sourcing Agent. Your working directory is the repo root.

          Step 1: Read all four instruction files in .claude/agent/:
            - instructions.md
            - diet-compliance-rules.md
            - blog-scores.md
            - approved-sources.md

          Step 2: Read recipes_source.csv and extract all existing URLs to avoid duplicates.

          Step 3: Find 20-25 new recipes following the instructions exactly.
            - Crawl at least 4 Tier 1/2 approved sources
            - Run at least 3 open web searches
            - Visit each recipe page and read the full ingredient list
            - Fill all 10 columns for every recipe
            - Apply GF and DF tags proactively from ingredients — do not wait for the blogger to label them
            - Balance protein types and cuisine styles

          Step 4: Append all new rows to recipes_source.csv.
            Column order: Recipe Title,URL,Blogger Name,Alignment Score,Meal Type,Cuisine Style,Rating,Notes,Diet Tags,Compliance Notes

          Do not modify existing rows. Quote any field containing commas.
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add recipes_source.csv
          git diff --staged --quiet || (
            COUNT=$(git diff HEAD~1 --stat 2>/dev/null | grep -oP '^\d+(?= insertion)' || echo "new")
            git commit -m "feat: weekly recipe sourcing — $(date +%Y-%m-%d)"
            git push
          )
