<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CKC — Review Queue</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0d;--surface:#1a1a16;--surface2:#222220;--border:rgba(255,255,255,0.08);
  --text:#f5f3ee;--muted:rgba(245,243,238,0.5);--faint:rgba(245,243,238,0.25);
  --green:#7cb87a;--green-bg:rgba(124,184,122,0.12);
  --red:#c96b6b;--red-bg:rgba(201,107,107,0.12);
  --yellow:#d4a843;--yellow-bg:rgba(212,168,67,0.12);
  --blue:#6aabda;--blue-bg:rgba(106,171,218,0.12);
  --font-display:'Cormorant Garamond',Georgia,serif;
  --font-body:'DM Sans',system-ui,sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);overflow:hidden}

/* ── Top bar ── */
.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--border);flex-shrink:0;gap:16px}
.topbar-left{display:flex;align-items:center;gap:20px}
.topbar-logo{font-family:var(--font-display);font-size:1.1rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.nav-toggle{display:flex;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:100px;overflow:hidden}
.nav-toggle a{padding:5px 14px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--muted);transition:all .15s;white-space:nowrap}
.nav-toggle a.active{background:var(--text);color:var(--bg);font-weight:500}
.topbar-right{display:flex;align-items:center;gap:12px}
.queue-count{font-size:12px;color:var(--muted)}
.queue-count strong{color:var(--yellow);font-weight:600}
.btn-push-all{padding:8px 20px;border-radius:100px;border:1.5px solid var(--green);background:var(--green-bg);color:var(--green);font-family:var(--font-body);font-size:12px;font-weight:500;letter-spacing:.04em;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-push-all:hover{background:rgba(124,184,122,0.22)}
.btn-push-all:disabled{opacity:.35;cursor:not-allowed}

/* ── Layout ── */
:root{--sidebar-w:320px}
.layout{display:grid;grid-template-columns:var(--sidebar-w) 5px 1fr;height:calc(100vh - 56px)}

/* ── Resizer ── */
.resizer{background:var(--border);cursor:col-resize;position:relative;z-index:10;transition:background .15s}
.resizer:hover,.resizer.dragging{background:var(--blue)}

/* ── Sidebar ── */
.sidebar{border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{padding:14px 16px 10px;flex-shrink:0;border-bottom:1px solid var(--border)}
.sidebar-title{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.sidebar-search{width:100%;padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font-body);font-size:13px;outline:none}
.sidebar-search:focus{border-color:var(--blue)}
.sidebar-list{flex:1;overflow-y:auto}
.recipe-item{padding:12px 16px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.04);transition:background .12s;display:flex;gap:10px;align-items:flex-start}
.recipe-item:hover{background:rgba(255,255,255,0.04)}
.recipe-item.active{background:var(--surface);border-left:3px solid var(--blue)}
.recipe-item.approved{opacity:.4}
.recipe-thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--surface2)}
.recipe-thumb-placeholder{width:40px;height:40px;border-radius:6px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.recipe-item-info{flex:1;min-width:0}
.recipe-item-name{font-size:13px;font-weight:500;line-height:1.3;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recipe-item-meta{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item-check{font-size:14px;color:var(--green);flex-shrink:0;margin-top:2px}
.sidebar-empty{padding:40px 16px;text-align:center;color:var(--faint);font-size:13px;line-height:1.6}

/* ── Main panel ── */
.main-panel{overflow-y:auto;display:flex;flex-direction:column}
.panel-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--faint)}
.panel-empty-icon{font-size:48px}
.panel-empty-text{font-family:var(--font-display);font-size:1.4rem;color:var(--muted)}
.panel-content{padding:28px 36px 120px;flex:1}

/* ── Recipe header ── */
.recipe-header{display:flex;gap:24px;margin-bottom:28px;align-items:flex-start}
.recipe-photo-wrap{position:relative;flex-shrink:0}
.recipe-photo{width:160px;height:160px;border-radius:12px;object-fit:cover;display:block;background:var(--surface2)}
.photo-edit-btn{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,0.7);border:none;border-radius:6px;color:var(--muted);font-size:11px;padding:4px 8px;cursor:pointer}
.photo-edit-btn:hover{color:var(--text)}
.recipe-meta{flex:1;min-width:0}

/* ── Editable fields ── */
.field-row{margin-bottom:12px}
.field-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.field-text{font-size:14px;color:var(--text);outline:none;border-bottom:1px solid transparent;padding-bottom:2px;transition:border-color .15s;min-width:60px;display:inline-block}
.field-text:hover{border-color:var(--border)}
.field-text:focus{border-color:var(--blue)}
.recipe-name-field{font-family:var(--font-display);font-size:1.6rem;font-weight:500;line-height:1.2;margin-bottom:8px;outline:none;border-bottom:1px solid transparent;display:block;width:100%}
.recipe-name-field:hover{border-color:var(--border)}
.recipe-name-field:focus{border-color:var(--blue)}
.field-url{font-size:12px;color:var(--blue);text-decoration:none}
.field-url:hover{text-decoration:underline}
.field-select{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font-body);font-size:13px;padding:4px 8px;outline:none;cursor:pointer}
.field-select:focus{border-color:var(--blue)}
.meta-row{display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin-top:8px}
.meta-item{display:flex;flex-direction:column;gap:3px}

/* ── Saving indicator ── */
.save-indicator{position:fixed;top:16px;right:24px;font-size:11px;color:var(--green);opacity:0;transition:opacity .3s;z-index:100;pointer-events:none}
.save-indicator.show{opacity:1}

/* ── Section titles ── */
.section{margin-bottom:24px}
.section-title{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}

/* ── Diet tags ── */
.diet-grid{display:flex;flex-wrap:wrap;gap:8px}
.diet-tag-card{border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-width:120px;background:var(--surface)}
.diet-tag-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.diet-code{font-size:11px;font-weight:700;letter-spacing:.05em;padding:2px 8px;border-radius:4px}
.diet-toggle-row{display:flex;gap:6px;margin-bottom:8px}
.diet-toggle{font-size:10px;padding:3px 10px;border-radius:100px;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;font-family:var(--font-body);transition:all .12s}
.diet-toggle.active-native{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.diet-toggle.active-mod{background:var(--yellow-bg);border-color:var(--yellow);color:var(--yellow)}
.diet-toggle.active-none{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.diet-notes{width:100%;font-size:11px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 8px;color:var(--muted);font-family:var(--font-body);resize:vertical;min-height:36px;outline:none;display:none}
.diet-notes.show{display:block}
.diet-notes:focus{border-color:var(--blue);color:var(--text)}

/* ── Diet tag colors ── */
.diet-code.GF{background:rgba(212,148,58,.15);color:#d4943a}
.diet-code.DF{background:rgba(106,171,218,.15);color:var(--blue)}
.diet-code.LH{background:rgba(196,127,196,.15);color:#c47fc4}
.diet-code.LF{background:rgba(212,168,67,.15);color:var(--yellow)}
.diet-code.AIP{background:rgba(224,120,120,.15);color:var(--red)}
.diet-code.K{background:rgba(155,142,224,.15);color:#9b8ee0}
.diet-code.V{background:rgba(124,184,122,.15);color:var(--green)}
.diet-code.Vg{background:rgba(91,191,181,.15);color:#5bbfb5}

/* ── Ingredients ── */
.ingredients-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 20px}
.ingredient-line{font-size:13px;color:var(--muted);padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.03);outline:none}
.ingredient-line:focus{color:var(--text);border-bottom-color:var(--blue)}
.add-ingredient-btn{font-size:12px;color:var(--faint);background:none;border:1px dashed var(--border);border-radius:6px;padding:6px 12px;cursor:pointer;margin-top:8px;font-family:var(--font-body)}
.add-ingredient-btn:hover{color:var(--muted);border-color:var(--muted)}

/* ── Text areas (notes/desc) ── */
.field-textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:var(--font-body);font-size:13px;line-height:1.5;resize:vertical;min-height:64px;outline:none}
.field-textarea:focus{border-color:var(--blue)}
.field-textarea::placeholder{color:var(--faint)}

/* ── Action bar ── */
.action-bar{position:fixed;bottom:0;left:calc(var(--sidebar-w) + 5px);right:0;padding:14px 36px;background:var(--bg);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;z-index:50}
.action-bar-hints{font-size:11px;color:var(--faint)}
.action-bar-btns{display:flex;gap:10px}
.btn{padding:9px 20px;border-radius:100px;font-family:var(--font-body);font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid var(--border);background:none;color:var(--muted);transition:all .15s}
.btn:hover{color:var(--text);border-color:var(--muted)}
.btn-reject{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.btn-reject:hover{background:rgba(201,107,107,0.22)}
.btn-approve{border-color:var(--green);color:var(--green);background:var(--green-bg);font-weight:600}
.btn-approve:hover{background:rgba(124,184,122,0.22)}

/* ── Toast ── */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:100px;padding:8px 18px;font-size:12px;color:var(--muted);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:200}
#toast.show{opacity:1}

/* ── Loading ── */
.loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:300;font-size:13px;color:var(--faint);letter-spacing:.08em}
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div class="topbar-left">
    <span class="topbar-logo">CKC</span>
    <nav class="nav-toggle">
      <a href="/admin">Swipe</a>
      <a href="/admin/catalog">Catalog</a>
      <a href="/admin/shopping">Shopping List</a>
      <a href="/admin/review-queue" class="active">Review Queue</a>
    </nav>
  </div>
  <div class="topbar-right">
    <span class="queue-count"><strong id="queue-count">—</strong> awaiting review</span>
    <button class="btn-push-all" id="btn-push-all" disabled onclick="pushAllToConsumer()">Push All to Consumer</button>
  </div>
</div>

<!-- Layout -->
<div class="layout">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Needs Review</div>
      <input class="sidebar-search" id="sidebar-search" type="text" placeholder="Search recipes…" oninput="filterSidebar()"/>
    </div>
    <div class="sidebar-list" id="sidebar-list">
      <div class="sidebar-empty">Loading queue…</div>
    </div>
  </div>

  <!-- Resizer -->
  <div class="resizer" id="resizer"></div>

  <!-- Main panel -->
  <div class="main-panel" id="main-panel">
    <div class="panel-empty">
      <div class="panel-empty-icon">👈</div>
      <div class="panel-empty-text">Select a recipe to review</div>
    </div>
  </div>

</div>

<!-- Action bar (hidden until recipe selected) -->
<div class="action-bar" id="action-bar" style="display:none">
  <span class="action-bar-hints">All changes auto-save · <kbd style="background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:10px">↑↓</kbd> navigate</span>
  <div class="action-bar-btns">
    <button class="btn" onclick="skipRecipe()">Skip for now</button>
    <button class="btn btn-reject" onclick="rejectRecipe()">Reject</button>
    <button class="btn btn-approve" onclick="approveRecipe()">✓ Approve → Consumer</button>
  </div>
</div>

<div class="save-indicator" id="save-indicator">Saved</div>
<div id="toast"></div>
<div class="loading-overlay" id="loading-overlay">Loading review queue…</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:            'AIzaSyBoTyWKQZ3oaf4KjhDikxMOF7bfv5W7Z7U',
  authDomain:        'ckc-recipe-swipe.firebaseapp.com',
  projectId:         'ckc-recipe-swipe',
  storageBucket:     'ckc-recipe-swipe.firebasestorage.app',
  messagingSenderId: '217552239546',
  appId:             '1:217552239546:web:bfd4121d6dccbd694a7b83',
});
const db = firebase.firestore();

// ── State ──────────────────────────────────────────────────────────────────
let allRecipes = [];       // all needs_review docs
let filtered   = [];       // after sidebar search
let currentId  = null;     // doc id of selected recipe
let saveTimer  = null;

const DIETS = ['AIP','LF','LH','K','GF','DF','V','Vg'];

// ── Boot ───────────────────────────────────────────────────────────────────
async function boot() {
  try {
    const snap = await db.collection('recipes')
      .where('status', '==', 'needs_review')
      .get();
    allRecipes = snap.docs.map(d => ({ _id: d.id, ...d.data() }));
    filtered   = [...allRecipes];
    renderSidebar();
    updateQueueCount();
  } catch(e) {
    document.getElementById('sidebar-list').innerHTML =
      `<div class="sidebar-empty">Error loading queue:<br>${e.message}</div>`;
  }
  document.getElementById('loading-overlay').style.display = 'none';
}

// ── Sidebar ────────────────────────────────────────────────────────────────
function filterSidebar() {
  const q = document.getElementById('sidebar-search').value.toLowerCase();
  filtered = q
    ? allRecipes.filter(r => (r.name||'').toLowerCase().includes(q) || (r.blogger||'').toLowerCase().includes(q))
    : [...allRecipes];
  renderSidebar();
}

function renderSidebar() {
  const list = document.getElementById('sidebar-list');
  if (!filtered.length) {
    list.innerHTML = '<div class="sidebar-empty">No recipes in queue</div>';
    return;
  }
  list.innerHTML = filtered.map(r => {
    const approved = r._approved;
    const img = r.image
      ? `<img class="recipe-thumb" src="${esc(r.image)}" onerror="this.outerHTML='<div class=\\'recipe-thumb-placeholder\\'>🍽️</div>'">`
      : `<div class="recipe-thumb-placeholder">🍽️</div>`;
    const diets = normalizeDietTags(r.dietTags || {});
    const dietStr = DIETS.filter(d => diets[d] && (diets[d].native || diets[d].mod))
      .map(d => `<span style="font-size:10px;color:var(--faint)">${d}</span>`).join(' ');
    return `<div class="recipe-item${r._id === currentId ? ' active' : ''}${approved ? ' approved' : ''}"
      onclick="selectRecipe('${r._id}')">
      ${img}
      <div class="recipe-item-info">
        <div class="recipe-item-name">${esc(r.name || 'Untitled')}</div>
        <div class="recipe-item-meta">${esc(r.blogger||'')} ${dietStr}</div>
      </div>
      ${approved ? '<div class="item-check">✓</div>' : ''}
    </div>`;
  }).join('');
}

function updateQueueCount() {
  const remaining = allRecipes.filter(r => !r._approved).length;
  document.getElementById('queue-count').textContent = remaining;
  const btn = document.getElementById('btn-push-all');
  btn.disabled = remaining === 0;
  btn.textContent = remaining > 0
    ? `Push ${remaining} to Consumer`
    : 'All Approved';
}

// ── Select recipe ──────────────────────────────────────────────────────────
function selectRecipe(id) {
  currentId = id;
  const r = allRecipes.find(x => x._id === id);
  if (!r) return;
  renderSidebar(); // update active state
  renderPanel(r);
  document.getElementById('action-bar').style.display = 'flex';
}

// ── Main panel ─────────────────────────────────────────────────────────────
function renderPanel(r) {
  const diets = normalizeDietTags(r.dietTags || {});
  const ings  = Array.isArray(r.ingredients) ? r.ingredients : [];

  document.getElementById('main-panel').innerHTML = `
  <div class="panel-content">

    <!-- Header -->
    <div class="recipe-header">
      <div class="recipe-photo-wrap">
        ${r.image
          ? `<img class="recipe-photo" id="recipe-photo-img" src="${esc(r.image)}" onerror="this.style.background='var(--surface2)'">`
          : `<div class="recipe-photo" style="display:flex;align-items:center;justify-content:center;font-size:3rem">🍽️</div>`}
        <button class="photo-edit-btn" onclick="editPhotoUrl()">Edit photo URL</button>
      </div>
      <div class="recipe-meta">
        <div contenteditable="true" class="recipe-name-field" data-field="name"
          onblur="saveField(this)">${esc(r.name||'')}</div>

        <div class="field-row">
          <div class="field-label">Source URL</div>
          ${r.url
            ? `<a href="${esc(r.url)}" target="_blank" class="field-url">${esc(r.url)}</a>
               <span style="color:var(--faint);margin-left:6px;cursor:pointer;font-size:11px"
                 onclick="editUrl()">edit</span>`
            : `<span style="color:var(--faint);font-size:12px;cursor:pointer" onclick="editUrl()">+ Add URL</span>`}
        </div>

        <div class="meta-row">
          <div class="meta-item">
            <div class="field-label">Blogger</div>
            <span contenteditable="true" class="field-text" data-field="blogger"
              onblur="saveField(this)">${esc(r.blogger||'')}</span>
          </div>
          <div class="meta-item">
            <div class="field-label">Cuisine</div>
            <span contenteditable="true" class="field-text" data-field="cuisine"
              onblur="saveField(this)">${esc(r.cuisine||'')}</span>
          </div>
          <div class="meta-item">
            <div class="field-label">Course</div>
            <span contenteditable="true" class="field-text" data-field="course"
              onblur="saveField(this)">${esc(r.course||'')}</span>
          </div>
          <div class="meta-item">
            <div class="field-label">Protein</div>
            <span contenteditable="true" class="field-text" data-field="protein"
              onblur="saveField(this)">${esc(r.protein||'')}</span>
          </div>
          <div class="meta-item">
            <div class="field-label">Rating</div>
            <span contenteditable="true" class="field-text" data-field="rating"
              onblur="saveField(this)">${esc(r.rating||'')}</span>
          </div>
          <div class="meta-item">
            <div class="field-label">Servings</div>
            <span contenteditable="true" class="field-text" data-field="servings"
              onblur="saveField(this)">${esc(String(r.servings||''))}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Diet Tags -->
    <div class="section">
      <div class="section-title">Diet Protocols</div>
      <div class="diet-grid" id="diet-grid">
        ${DIETS.map(d => renderDietCard(d, diets[d] || {})).join('')}
      </div>
    </div>

    <!-- Chef's Notes -->
    <div class="section">
      <div class="section-title">Chef's Notes</div>
      <div class="field-row">
        <textarea class="field-textarea" data-field="chefNotes"
          onblur="saveField(this)" placeholder="Auto-generated from ingredients — edit if needed…">${esc(r.chefNotes||'')}</textarea>
      </div>
    </div>

    <!-- Ingredients -->
    <div class="section">
      <div class="section-title">Ingredients (${ings.length}) — click any line to edit</div>
      <div class="ingredients-grid" id="ingredients-grid">
        ${ings.map((ing, i) =>
          `<div contenteditable="true" class="ingredient-line" data-index="${i}"
            onblur="saveIngredient(this)">${esc(ing)}</div>`
        ).join('')}
      </div>
      <button class="add-ingredient-btn" onclick="addIngredient()">+ Add ingredient</button>
    </div>

  </div>`;
}

// ── Diet tag card ──────────────────────────────────────────────────────────
function renderDietCard(code, tag) {
  const state = tag.native ? 'native' : tag.mod ? 'mod' : 'none';
  const hasNotes = !!(tag.notes && tag.notes.trim());
  return `<div class="diet-tag-card" id="diet-card-${code}">
    <div class="diet-tag-header">
      <span class="diet-code ${code}">${code}</span>
    </div>
    <div class="diet-toggle-row">
      <button class="diet-toggle${state==='native'?' active-native':''}" onclick="setDiet('${code}','native')">Native</button>
      <button class="diet-toggle${state==='mod'?' active-mod':''}" onclick="setDiet('${code}','mod')">Mod</button>
      <button class="diet-toggle${state==='none'?' active-none':''}" onclick="setDiet('${code}','none')">None</button>
    </div>
    <textarea class="diet-notes${(state==='mod'||hasNotes)?' show':''}" id="diet-notes-${code}"
      placeholder="Modification note…"
      onblur="saveDietNotes('${code}', this.value)">${esc(tag.notes||'')}</textarea>
  </div>`;
}

function setDiet(code, state) {
  const r = allRecipes.find(x => x._id === currentId);
  if (!r) return;
  if (!r.dietTags) r.dietTags = {};
  if (!r.dietTags[code]) r.dietTags[code] = {};
  r.dietTags[code].native = state === 'native';
  r.dietTags[code].mod    = state === 'mod';
  // re-render just this card
  document.getElementById(`diet-card-${code}`).outerHTML = renderDietCard(code, r.dietTags[code]);
  scheduleSave({ dietTags: r.dietTags });
}

function saveDietNotes(code, val) {
  const r = allRecipes.find(x => x._id === currentId);
  if (!r) return;
  if (!r.dietTags) r.dietTags = {};
  if (!r.dietTags[code]) r.dietTags[code] = {};
  r.dietTags[code].notes = val;
  scheduleSave({ dietTags: r.dietTags });
}

// ── Field saving ───────────────────────────────────────────────────────────
function saveField(el) {
  const field = el.dataset.field;
  const val   = el.tagName === 'TEXTAREA' ? el.value : el.innerText.trim();
  const r = allRecipes.find(x => x._id === currentId);
  if (!r || !field) return;
  r[field] = val;
  // Update sidebar name if name changed
  if (field === 'name') renderSidebar();
  scheduleSave({ [field]: val });
}

function saveIngredient(el) {
  const r = allRecipes.find(x => x._id === currentId);
  if (!r) return;
  const idx = parseInt(el.dataset.index);
  const val = el.innerText.trim();
  if (!r.ingredients) r.ingredients = [];
  r.ingredients[idx] = val;
  scheduleSave({ ingredients: r.ingredients });
}

function addIngredient() {
  const r = allRecipes.find(x => x._id === currentId);
  if (!r) return;
  if (!r.ingredients) r.ingredients = [];
  r.ingredients.push('');
  const grid = document.getElementById('ingredients-grid');
  const div = document.createElement('div');
  div.contentEditable = 'true';
  div.className = 'ingredient-line';
  div.dataset.index = r.ingredients.length - 1;
  div.addEventListener('blur', () => saveIngredient(div));
  grid.appendChild(div);
  div.focus();
}

function editPhotoUrl() {
  const r = allRecipes.find(x => x._id === currentId);
  if (!r) return;
  const url = prompt('Photo URL:', r.image || '');
  if (url === null) return;
  r.image = url.trim();
  const img = document.getElementById('recipe-photo-img');
  if (img) img.src = r.image;
  // update sidebar thumbnail
  renderSidebar();
  scheduleSave({ image: r.image });
}

function editUrl() {
  const r = allRecipes.find(x => x._id === currentId);
  if (!r) return;
  const url = prompt('Source URL:', r.url || '');
  if (url === null) return;
  r.url = url.trim();
  scheduleSave({ url: r.url });
  // re-render URL row
  renderPanel(r);
}

// ── Debounced Firestore write ──────────────────────────────────────────────
function scheduleSave(fields) {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => writeToFirestore(fields), 800);
}

async function writeToFirestore(fields) {
  if (!currentId) return;
  try {
    await db.collection('recipes').doc(currentId).update(fields);
    flashSaved();
  } catch(e) {
    showToast('Save failed: ' + e.message);
  }
}

function flashSaved() {
  const el = document.getElementById('save-indicator');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1500);
}

// ── Approve / Reject / Skip ────────────────────────────────────────────────
async function approveRecipe() {
  if (!currentId) return;
  try {
    await db.collection('recipes').doc(currentId).update({ status: 'approved' });
    const r = allRecipes.find(x => x._id === currentId);
    if (r) r._approved = true;
    renderSidebar();
    updateQueueCount();
    showToast('✓ Approved — recipe is now live on consumer');
    advanceToNext();
  } catch(e) {
    showToast('Error: ' + e.message);
  }
}

async function rejectRecipe() {
  if (!currentId) return;
  if (!confirm('Reject this recipe? It will be set back to "no".')) return;
  try {
    await db.collection('recipes').doc(currentId).update({ status: 'no' });
    allRecipes = allRecipes.filter(x => x._id !== currentId);
    filtered   = filtered.filter(x => x._id !== currentId);
    updateQueueCount();
    showToast('Recipe rejected');
    advanceToNext();
  } catch(e) {
    showToast('Error: ' + e.message);
  }
}

function skipRecipe() {
  advanceToNext();
}

function advanceToNext() {
  const idx = filtered.findIndex(r => r._id === currentId);
  const next = filtered.find((r, i) => i > idx && !r._approved);
  if (next) {
    selectRecipe(next._id);
  } else {
    currentId = null;
    document.getElementById('action-bar').style.display = 'none';
    document.getElementById('main-panel').innerHTML = `
      <div class="panel-empty">
        <div class="panel-empty-icon">✅</div>
        <div class="panel-empty-text">All recipes reviewed</div>
      </div>`;
    renderSidebar();
  }
}

async function pushAllToConsumer() {
  const pending = allRecipes.filter(r => !r._approved);
  if (!pending.length) return;
  if (!confirm(`Push ${pending.length} recipes to consumer? This makes them live immediately.`)) return;
  document.getElementById('btn-push-all').disabled = true;
  let done = 0;
  try {
    const batch = db.batch();
    pending.forEach(r => {
      batch.update(db.collection('recipes').doc(r._id), { status: 'approved' });
      r._approved = true;
    });
    await batch.commit();
    done = pending.length;
    renderSidebar();
    updateQueueCount();
    showToast(`✓ ${done} recipes pushed to consumer`);
  } catch(e) {
    showToast('Batch push failed: ' + e.message);
    document.getElementById('btn-push-all').disabled = false;
  }
}

// ── Keyboard navigation ────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.matches('[contenteditable],[data-field],textarea,input')) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const idx  = filtered.findIndex(r => r._id === currentId);
    const next = e.key === 'ArrowDown'
      ? filtered.find((r, i) => i > idx)
      : filtered.slice(0, idx).reverse().find(() => true);
    if (next) selectRecipe(next._id);
  }
  if (e.key === 'Enter' && currentId) approveRecipe();
});

// ── Helpers ────────────────────────────────────────────────────────────────
function normalizeDietTags(raw) {
  const out = {};
  DIETS.forEach(d => {
    const v = raw[d] || raw[d.toLowerCase()] || {};
    out[d] = {
      native: !!(v.native || v === 'native'),
      mod:    !!(v.mod    || v === 'mod'),
      notes:  v.notes || '',
    };
  });
  return out;
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

boot();

// ── Resizable sidebar ─────────────────────────────────────────────────────
(function(){
  const resizer = document.getElementById('resizer');
  const layout = document.querySelector('.layout');
  let dragging = false, startX = 0, startW = 0;

  resizer.addEventListener('mousedown', e => {
    dragging = true;
    startX = e.clientX;
    startW = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-w'));
    resizer.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const newW = Math.min(Math.max(200, startW + (e.clientX - startX)), window.innerWidth - 300);
    document.documentElement.style.setProperty('--sidebar-w', newW + 'px');
    layout.style.gridTemplateColumns = `${newW}px 5px 1fr`;
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    resizer.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
})();
</script>
</body>
</html>
