<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CKC — Meal Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0d;--surface:#1a1a16;--surface2:#222220;--surface3:#2a2a26;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.13);
  --text-primary:#f5f3ee;--text-secondary:rgba(245,243,238,0.55);--text-muted:rgba(245,243,238,0.28);
  --green:#7cb87a;--green-bg:rgba(124,184,122,0.12);
  --red:#c96b6b;--accent:#c9a96b;--accent-bg:rgba(201,169,107,0.10);
  --font-display:'Cormorant Garamond',Georgia,serif;--font-body:'DM Sans',system-ui,sans-serif;
  --left-w:420px;--header-h:56px;
}
html,body{height:100%;background:var(--bg);color:var(--text-primary);font-family:var(--font-body);font-size:14px;overflow:hidden}

/* ── Login ── */
#login-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;padding:2rem;z-index:200;background:var(--bg)}
.login-logo{font-family:var(--font-display);font-size:2.2rem;font-weight:500;letter-spacing:.15em;text-transform:uppercase}
.login-tagline{font-size:11px;color:var(--text-muted);letter-spacing:.12em;text-transform:uppercase;margin-top:-.8rem}
.login-form{display:flex;flex-direction:column;gap:10px;width:100%;max-width:260px}
.login-input{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text-primary);font-family:var(--font-body);font-size:14px;outline:none}
.login-input:focus{border-color:rgba(255,255,255,.2)}
.login-input::placeholder{color:var(--text-muted)}
.login-btn{background:var(--text-primary);color:var(--bg);border:none;border-radius:100px;padding:12px;font-family:var(--font-body);font-size:14px;font-weight:500;cursor:pointer}
.login-error{font-size:12px;color:var(--red);text-align:center;min-height:16px}

/* ── App shell ── */
#app{display:none;height:100%;flex-direction:column}
#app.visible{display:flex}

/* ── Top header ── */
#header{display:flex;align-items:center;gap:12px;padding:0 20px;height:var(--header-h);border-bottom:1px solid var(--border);flex-shrink:0}
.header-logo{font-family:var(--font-display);font-size:1.4rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;margin-right:4px}
.header-title{font-size:13px;color:var(--text-secondary);font-weight:300;letter-spacing:.06em;text-transform:uppercase}
.header-sep{width:1px;height:20px;background:var(--border);margin:0 4px}
.nav-toggle{display:flex;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:100px;overflow:hidden;margin-left:auto}
.nav-toggle a{padding:5px 14px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--text-muted);transition:all .15s}
.nav-toggle a.active{background:var(--text-primary);color:var(--bg);font-weight:500}

/* ── Two-panel layout ── */
#panels{display:flex;flex:1;overflow:hidden}

/* ── LEFT: Recipe Picker ── */
#picker-panel{width:var(--left-w);min-width:var(--left-w);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}

#picker-toolbar{padding:14px 16px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0}
#picker-toolbar .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.search-wrap{position:relative;flex:1;min-width:180px}
.search-wrap input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px 8px 32px;color:var(--text-primary);font-family:var(--font-body);font-size:13px;outline:none}
.search-wrap input:focus{border-color:var(--border2)}
.search-wrap input::placeholder{color:var(--text-muted)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:13px;pointer-events:none}

.filter-select{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--text-secondary);font-family:var(--font-body);font-size:12px;outline:none;cursor:pointer}
.filter-select:focus{border-color:var(--border2)}

.picker-count{font-size:11px;color:var(--text-muted);letter-spacing:.04em}

#recipe-list{flex:1;overflow-y:auto;padding:8px}
#recipe-list::-webkit-scrollbar{width:4px}
#recipe-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

.recipe-card{display:flex;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;transition:background .12s,border-color .12s;align-items:center;margin-bottom:2px}
.recipe-card:hover{background:var(--surface)}
.recipe-card.in-menu{background:var(--green-bg);border-color:rgba(124,184,122,0.25)}
.recipe-card.in-menu .rc-name{color:var(--green)}
.recipe-thumb{width:54px;height:40px;border-radius:5px;object-fit:cover;background:var(--surface2);flex-shrink:0}
.rc-info{flex:1;min-width:0}
.rc-name{font-size:13px;font-weight:400;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-meta{font-size:11px;color:var(--text-muted);margin-top:2px;display:flex;gap:6px}
.rc-protein{color:var(--accent);font-weight:500}

/* Diet tag circles — native=solid fill, modified=dashed border */
.diet-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;min-height:0}
.diet-token-circle{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;letter-spacing:.02em;flex-shrink:0}
.rc-add-btn{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .12s;line-height:1}
.recipe-card.in-menu .rc-add-btn{border-color:var(--green);color:var(--green);font-size:14px}
.recipe-card:hover .rc-add-btn{border-color:var(--border2);color:var(--text-primary)}

/* ── RIGHT: Meal Plan + Shopping List ── */
#plan-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* Menu strip */
#menu-strip{border-bottom:1px solid var(--border);flex-shrink:0}
#menu-header{display:flex;align-items:center;gap:10px;padding:14px 20px 10px}
.menu-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
#menu-count{font-size:11px;letter-spacing:.06em;color:var(--accent);margin-left:auto}
#clear-menu-btn{font-size:11px;color:var(--text-muted);cursor:pointer;background:none;border:none;font-family:var(--font-body);padding:0;transition:color .12s}
#clear-menu-btn:hover{color:var(--red)}

#menu-cards{display:flex;gap:10px;padding:0 20px 14px;overflow-x:auto;min-height:92px;align-items:flex-start}
#menu-cards::-webkit-scrollbar{height:3px}
#menu-cards::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.menu-empty{font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:6px;height:70px;margin-top:0}

.menu-card{position:relative;flex-shrink:0;width:110px;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:var(--surface);cursor:default}
.menu-card img{width:100%;height:62px;object-fit:cover;display:block;background:var(--surface2)}
.menu-card-name{font-size:10px;padding:5px 6px;line-height:1.3;height:34px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.menu-card-remove{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,0.7);border:none;color:#fff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;transition:background .12s}
.menu-card-remove:hover{background:var(--red)}
.menu-servings{display:flex;align-items:center;gap:4px;padding:4px 6px 5px;border-top:1px solid var(--border)}
.srv-btn{background:none;border:none;color:var(--text-muted);font-size:14px;cursor:pointer;padding:0 2px;line-height:1;transition:color .12s}
.srv-btn:hover{color:var(--text-primary)}
.srv-label{font-size:10px;color:var(--text-secondary);flex:1;text-align:center}

/* ── Shopping list ── */
#list-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
#list-header{display:flex;align-items:center;gap:10px;padding:14px 20px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.list-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
#list-actions{display:flex;gap:8px;margin-left:auto}
.action-btn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 12px;font-size:11px;color:var(--text-secondary);cursor:pointer;font-family:var(--font-body);transition:all .12s;display:flex;align-items:center;gap:5px;letter-spacing:.04em}
.action-btn:hover{border-color:var(--border2);color:var(--text-primary)}
.action-btn.clear-btn:hover{color:var(--red);border-color:rgba(201,107,107,0.3)}

#shopping-list{flex:1;overflow-y:auto;padding:12px 20px 40px}
#shopping-list::-webkit-scrollbar{width:4px}
#shopping-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

.list-empty{padding:60px 0;text-align:center;color:var(--text-muted)}
.list-empty-icon{font-size:32px;margin-bottom:12px}
.list-empty-text{font-size:13px;line-height:1.6}

/* Category sections */
.cat-section{margin-bottom:18px}
.cat-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer;user-select:none}
.cat-icon{font-size:14px}
.cat-name{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);font-weight:500}
.cat-badge{font-size:10px;color:var(--text-muted);background:var(--surface2);border-radius:100px;padding:1px 7px}
.cat-toggle{margin-left:auto;font-size:10px;color:var(--text-muted)}
.cat-items{display:flex;flex-direction:column;gap:2px}

/* Shopping item */
.shop-item{display:flex;align-items:flex-start;gap:10px;padding:7px 10px;border-radius:7px;transition:background .1s;cursor:pointer}
.shop-item:hover{background:var(--surface)}
.shop-item.checked{opacity:.4}
.shop-item.checked .item-name{text-decoration:line-through}
.item-check{width:16px;height:16px;border-radius:4px;border:1px solid var(--border2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .12s;color:var(--green);font-size:11px}
.shop-item.checked .item-check{background:var(--green-bg);border-color:var(--green)}
.item-body{flex:1;min-width:0}
.item-qty{font-size:12px;font-weight:500;color:var(--accent);min-width:60px;display:inline}
.item-name{font-size:13px;color:var(--text-primary);display:inline;margin-left:6px}
.item-sources{font-size:10px;color:var(--text-muted);margin-top:2px;line-height:1.4}

/* Diet swap rows */
.shop-item.swap-row{background:rgba(201,169,107,0.06);border-left:2px solid var(--accent)}
.shop-item.crossed-row{background:rgba(201,107,107,0.06);border-left:2px solid var(--red);opacity:.7}
.shop-item.crossed-row .item-name{text-decoration:line-through;color:var(--red)}
.swap-badge{font-size:10px;font-weight:500;border:1px solid;border-radius:100px;padding:1px 7px;white-space:nowrap;flex-shrink:0;align-self:center}
.swap-note{font-size:10px;color:var(--text-muted);margin-top:2px}

/* No data banner */
.no-data-banner{background:var(--accent-bg);border:1px solid rgba(201,169,107,0.2);border-radius:8px;padding:12px 16px;margin:12px 20px;display:flex;align-items:flex-start;gap:10px}
.no-data-banner .icon{font-size:16px;flex-shrink:0;margin-top:1px}
.no-data-banner p{font-size:12px;color:var(--accent);line-height:1.5}
.no-data-banner code{font-family:monospace;background:rgba(201,169,107,0.15);padding:1px 5px;border-radius:3px;font-size:11px}

/* ── Diet test tokens ── */
#diet-token-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
#diet-token-bar::-webkit-scrollbar{display:none}
.diet-token{width:38px;height:38px;border-radius:50%;border:1.5px solid;background:transparent;font-family:var(--font-body);font-size:10px;font-weight:700;letter-spacing:.02em;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;padding:0;opacity:0.45}
.diet-token:hover{opacity:0.75}
.diet-token.active{opacity:1;color:#0f0f0d!important}
.diet-clear-btn{border:1px solid var(--border);border-radius:100px;padding:5px 14px;font-size:11px;color:var(--text-muted);cursor:pointer;background:transparent;font-family:var(--font-body);white-space:nowrap;transition:all .15s;margin-left:4px}
.diet-clear-btn:hover{border-color:var(--border2);color:var(--text-secondary)}

/* Compliance badges on menu cards */
.menu-card .compliance-badge{position:absolute;bottom:36px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:.06em;padding:2px 4px;font-family:var(--font-body)}
.compliance-native{background:rgba(124,184,122,0.85);color:#0f0f0d}
.compliance-mod{background:rgba(201,169,107,0.85);color:#0f0f0d}
.compliance-none{background:rgba(201,107,107,0.85);color:#fff}
</style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-logo">CKC</div>
  <div class="login-tagline">Meal Planner</div>
  <div class="login-form">
    <input class="login-input" id="login-user" type="text" placeholder="Username" autocomplete="username">
    <input class="login-input" id="login-pass" type="password" placeholder="Password" autocomplete="current-password">
    <button class="login-btn" id="login-btn">Sign in</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- App -->
<div id="app">

  <!-- Header -->
  <div id="header">
    <div class="header-logo">CKC</div>
    <div class="header-sep"></div>
    <div class="header-title">Meal Planner</div>
    <div class="nav-toggle" style="margin-left:auto">
      <a href="/admin">Swipe</a>
      <a href="/admin/catalog">Catalog</a>
      <a href="/admin/shopping" class="active">Shopping List</a>
    </div>
  </div>

  <div id="panels">

    <!-- LEFT: Recipe Picker -->
    <div id="picker-panel">
      <div id="picker-toolbar">
        <div class="row">
          <div class="search-wrap">
            <span class="search-icon">⌕</span>
            <input type="text" id="recipe-search" placeholder="Search recipes…" oninput="filterRecipes()">
          </div>
        </div>
        <div class="row">
          <select class="filter-select" id="filter-protein" onchange="filterRecipes()">
            <option value="">All proteins</option>
          </select>
          <select class="filter-select" id="filter-cuisine" onchange="filterRecipes()">
            <option value="">All cuisines</option>
          </select>
          <select class="filter-select" id="filter-diet" onchange="filterRecipes()">
            <option value="">Any diet</option>
            <option value="GF">Gluten-Free</option>
            <option value="DF">Dairy-Free</option>
            <option value="V">Vegan</option>
            <option value="Vg">Vegetarian</option>
            <option value="K">Keto</option>
            <option value="LF">Low-FODMAP</option>
            <option value="AIP">AIP</option>
            <option value="LH">Low-Histamine</option>
          </select>
        </div>
        <div class="picker-count" id="picker-count">Loading…</div>
      </div>
      <div id="recipe-list"></div>
    </div>

    <!-- RIGHT: Plan + List -->
    <div id="plan-panel">

      <!-- Menu strip -->
      <div id="menu-strip">
        <div id="menu-header">
          <span class="menu-label">This Week's Menu</span>
          <span id="menu-count">0 recipes</span>
          <button id="clear-menu-btn" onclick="clearMenu()">Clear all</button>
        </div>
        <div id="menu-cards">
          <span class="menu-empty">← Pick recipes from the left to build your menu</span>
        </div>
      </div>

      <!-- Diet test tokens -->
      <div id="diet-token-bar">
        <button class="diet-token" data-diet="AIP" data-color="#e07878" onclick="toggleDietToken('AIP')" title="AIP"          style="border-color:#e07878;color:#e07878">AIP</button>
        <button class="diet-token" data-diet="DF"  data-color="#6aabda" onclick="toggleDietToken('DF')"  title="Dairy-Free"    style="border-color:#6aabda;color:#6aabda">DF</button>
        <button class="diet-token" data-diet="GF"  data-color="#d4943a" onclick="toggleDietToken('GF')"  title="Gluten-Free"   style="border-color:#d4943a;color:#d4943a">GF</button>
        <button class="diet-token" data-diet="K"   data-color="#9b8ee0" onclick="toggleDietToken('K')"   title="Keto"          style="border-color:#9b8ee0;color:#9b8ee0">K</button>
        <button class="diet-token" data-diet="LF"  data-color="#d4a843" onclick="toggleDietToken('LF')"  title="Low-FODMAP"    style="border-color:#d4a843;color:#d4a843">LF</button>
        <button class="diet-token" data-diet="LH"  data-color="#c47fc4" onclick="toggleDietToken('LH')"  title="Low-Histamine" style="border-color:#c47fc4;color:#c47fc4">LH</button>
        <button class="diet-token" data-diet="V"   data-color="#7cb87a" onclick="toggleDietToken('V')"   title="Vegan"         style="border-color:#7cb87a;color:#7cb87a">V</button>
        <button class="diet-token" data-diet="Vg"  data-color="#5bbfb5" onclick="toggleDietToken('Vg')"  title="Vegetarian"    style="border-color:#5bbfb5;color:#5bbfb5">Vg</button>
        <button class="diet-clear-btn" onclick="clearDietToken()" title="Clear diet filter">Clear all</button>
      </div>

      <!-- Shopping list -->
      <div id="list-panel">
        <div id="list-header">
          <span class="list-label">Shopping List</span>
          <div id="list-actions">
            <button class="action-btn" onclick="toggleChecked()">Hide checked</button>
            <button class="action-btn" onclick="copyList()">Copy</button>
            <button class="action-btn" onclick="printList()">Print</button>
            <button class="action-btn clear-btn" onclick="uncheckAll()">Uncheck all</button>
          </div>
        </div>
        <div id="shopping-list">
          <div class="list-empty">
            <div class="list-empty-icon"></div>
            <div class="list-empty-text">Add recipes to your menu<br>to generate a shopping list</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// Auth
// ─────────────────────────────────────────────
const LOGIN_KEY = 'ckc_auth';
document.getElementById('login-btn').addEventListener('click', doLogin);
document.getElementById('login-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  if(u === 'admin' && p === 'prince') {
    localStorage.setItem(LOGIN_KEY, '1');
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').classList.add('visible');
    initApp();
  } else {
    document.getElementById('login-error').textContent = 'Incorrect username or password';
  }
}

if(localStorage.getItem(LOGIN_KEY)) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  initApp();
}

// ─────────────────────────────────────────────
// State
// ─────────────────────────────────────────────
let allRecipes   = [];
let ingredients  = {};    // { "Recipe Name": ["raw ingredient", ...] }
let menuItems    = [];    // Array of { recipe, servings }
let checkedItems = new Set();
let hideChecked  = false;
let hasIngredients = false;

// ─────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────
async function initApp() {
  // Load yes recipes from unified collection
  try {
    const snap = await db.collection('recipes').where('status', '==', 'yes').get();
    allRecipes = snap.docs.map(d => ({_docId: d.id, ...d.data()}));

    // Build ingredients map from recipe docs (ingredients field is now inline)
    allRecipes.forEach(r => {
      if(r.ingredients && r.ingredients.length) {
        ingredients[r.name] = r.ingredients;
      }
    });
    hasIngredients = Object.keys(ingredients).length > 0;
  } catch(e) {
    console.warn('Firestore load failed:', e.message);
  }

  populateFilters();
  filterRecipes();
  restoreMenu();
}

// ─────────────────────────────────────────────
// Protein tag normalization
// ─────────────────────────────────────────────
const PROTEIN_MAP = {
  // Chicken
  'chicken':'Chicken',
  // Beef (generic "meat" tag also maps here — exceptions flagged in protein_tag_review.csv)
  'beef':'Beef','steak':'Beef','meat':'Beef',
  // Pork
  'pork':'Pork',
  // Turkey
  'turkey':'Turkey',

function normalizeProtein(raw) {
  if (!raw) return '';
  const key = raw.trim().toLowerCase();
  return PROTEIN_MAP[key] || (raw.charAt(0).toUpperCase() + raw.slice(1));
}

// ─────────────────────────────────────────────
// Filters
// ─────────────────────────────────────────────
function populateFilters() {
  const proteins = [...new Set(allRecipes.map(r => normalizeProtein(r.protein)).filter(Boolean))].sort();
  const cuisines = [...new Set(allRecipes.map(r => r.cuisine).filter(Boolean))].sort();

  const pSel = document.getElementById('filter-protein');
  proteins.forEach(p => { const o = document.createElement('option'); o.value = p; o.textContent = p; pSel.appendChild(o); });

  const cSel = document.getElementById('filter-cuisine');
  cuisines.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; cSel.appendChild(o); });
}

function filterRecipes() {
  const q    = document.getElementById('recipe-search').value.toLowerCase();
  const prot = document.getElementById('filter-protein').value;
  const cui  = document.getElementById('filter-cuisine').value;
  const diet = document.getElementById('filter-diet').value;

  const filtered = allRecipes.filter(r => {
    if(q && !r.name.toLowerCase().includes(q) && !((r.blogger||'').toLowerCase().includes(q))) return false;
    if(prot && normalizeProtein(r.protein) !== prot) return false;
    if(cui && r.cuisine !== cui) return false;
    if(diet) {
      const tag = r.dietTags && r.dietTags[diet];
      if(!tag || (!tag.native && !tag.mod)) return false;
    }
    return true;
  });

  document.getElementById('picker-count').textContent = `${filtered.length} of ${allRecipes.length} recipes`;
  renderRecipeList(filtered);
}

// ─────────────────────────────────────────────
// Recipe list
// ─────────────────────────────────────────────
function normalizeDietTags(dietTags) {
  if (!dietTags) return {};
  const out = {};
  for (const [code, val] of Object.entries(dietTags)) {
    if (val && typeof val === 'object' && ('native' in val || 'mod' in val)) {
      out[code] = { native: !!val.native, mod: !!val.mod, notes: val.notes || '' };
    } else if (typeof val === 'string') {
      const hasNote = val.trim().length > 0;
      out[code] = { native: !hasNote, mod: hasNote, notes: val.trim() };
    } else if (val) {
      out[code] = { native: true, mod: false, notes: '' };
    }
  }
  return out;
}

const DIET_COLORS = {
  AIP:'#e07878', DF:'#6aabda', GF:'#d4943a', K:'#9b8ee0',
  LF:'#d4a843',  LH:'#c47fc4', V:'#7cb87a',  Vg:'#5bbfb5',
};
const DIET_ORDER = ['AIP','DF','GF','K','LF','LH','V','Vg'];

function renderDietPills(dietTags) {
  const dt = normalizeDietTags(dietTags);
  const tags = DIET_ORDER.filter(k => dt[k] && (dt[k].native || dt[k].mod));
  if (!tags.length) return '';
  const circles = tags.map(k => {
    const color = DIET_COLORS[k] || '#aaa';
    const isNative = dt[k].native;
    const tip = dt[k].notes ? ` title="${esc(dt[k].notes)}"` : '';
    const style = isNative
      ? `background:${color};color:#0f0f0d;border:1.5px solid ${color}`
      : `background:transparent;color:${color};border:1.5px dashed ${color}`;
    return `<span class="diet-token-circle" style="${style}"${tip}>${k}</span>`;
  }).join('');
  return `<div class="diet-pills">${circles}</div>`;
}

function renderRecipeList(recipes) {
  const container = document.getElementById('recipe-list');
  const inMenuSet = new Set(menuItems.map(m => m.recipe.name));

  container.innerHTML = recipes.map(r => {
    const inMenu = inMenuSet.has(r.name);
    const rating = r.rating && r.rating !== 'NR' ? `★ ${r.rating.split(' ')[0]}` : '';
    return `
    <div class="recipe-card ${inMenu ? 'in-menu' : ''}" data-name="${esc(r.name)}">
      <img class="recipe-thumb" src="${esc(r.image||'')}" alt="" loading="lazy" onerror="this.style.background='var(--surface2)';this.src=''">
      <div class="rc-info">
        <div class="rc-name">${esc(r.name)}</div>
        <div class="rc-meta">
          <span class="rc-protein">${esc(normalizeProtein(r.protein))}</span>
          <span>${esc(r.blogger||'')}</span>
          ${rating ? `<span>${rating}</span>` : ''}
        </div>
        ${renderDietPills(r.dietTags)}
      </div>
      <button class="rc-add-btn" title="${inMenu ? 'Remove from menu' : 'Add to menu'}">${inMenu ? '✓' : '+'}</button>
    </div>`;
  }).join('');

  // Event delegation — avoids all quote-escaping issues in inline onclick
  container.onclick = e => {
    const card = e.target.closest('.recipe-card');
    if(card) toggleRecipe(card.dataset.name);
  };
}

function toggleRecipe(name) {
  const recipe = allRecipes.find(r => r.name === name);
  if(!recipe) return;
  const idx = menuItems.findIndex(m => m.recipe.name === name);
  if(idx >= 0) {
    menuItems.splice(idx, 1);
  } else {
    menuItems.push({ recipe, servings: 1 });
  }
  saveMenu();
  updateMenuStrip();
  buildShoppingList();
  // Re-render list to update checkmarks
  filterRecipes();
}

// ─────────────────────────────────────────────
// Menu strip
// ─────────────────────────────────────────────
function updateMenuStrip() {
  const container = document.getElementById('menu-cards');
  const countEl   = document.getElementById('menu-count');
  countEl.textContent = `${menuItems.length} recipe${menuItems.length !== 1 ? 's' : ''}`;

  if(menuItems.length === 0) {
    container.innerHTML = '<span class="menu-empty">← Pick recipes from the left to build your menu</span>';
    return;
  }

  container.innerHTML = menuItems.map((m, i) => {
    const compliance = getCompliance(m.recipe, activeDietToken);
    const badgeHtml = compliance
      ? `<div class="compliance-badge ${
          compliance === 'native' ? 'compliance-native' :
          compliance === 'mod'    ? 'compliance-mod'    : 'compliance-none'
        }">${
          compliance === 'native' ? '✓ Compliant' :
          compliance === 'mod'    ? '~ Modified'  : '✕ Not compliant'
        }</div>`
      : '';
    return `
    <div class="menu-card">
      <img src="${esc(m.recipe.image||'')}" alt="" onerror="this.style.background='var(--surface2)';this.src=''">
      <button class="menu-card-remove" onclick="removeFromMenu(${i})">×</button>
      ${badgeHtml}
      <div class="menu-card-name">${esc(m.recipe.name)}</div>
      <div class="menu-servings">
        <button class="srv-btn" onclick="changeServings(${i},-1)">−</button>
        <span class="srv-label">${m.servings}×</span>
        <button class="srv-btn" onclick="changeServings(${i},1)">+</button>
      </div>
    </div>`;
  }).join('');
}

function removeFromMenu(idx) {
  menuItems.splice(idx, 1);
  saveMenu();
  updateMenuStrip();
  buildShoppingList();
  filterRecipes();
}

function changeServings(idx, delta) {
  const steps = [0.5, 1, 2, 3, 4, 5];
  const cur = steps.indexOf(menuItems[idx].servings);
  const next = Math.max(0, Math.min(steps.length - 1, cur + delta));
  menuItems[idx].servings = steps[next];
  saveMenu();
  buildShoppingList();
  // Update just the label
  updateMenuStrip();
}

function clearMenu() {
  if(menuItems.length === 0) return;
  menuItems = [];
  checkedItems.clear();
  saveMenu();
  updateMenuStrip();
  buildShoppingList();
  filterRecipes();
}

// Pre-sorted DB keys (longest first) for containment matching
const DB_KEYS_BY_LENGTH = Object.keys(INGREDIENT_DB).sort((a, b) => b.length - a.length);

// Levenshtein distance for fuzzy ingredient matching (from Apps Script approach)
function levenshteinDistance(a, b) {
  a = a.toLowerCase(); b = b.toLowerCase();
  const matrix = [];
  for (let i = 0; i <= b.length; i++) matrix[i] = [i];
  for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
  for (let i = 1; i <= b.length; i++) {
    for (let j = 1; j <= a.length; j++) {
      if (b.charAt(i-1) === a.charAt(j-1)) matrix[i][j] = matrix[i-1][j-1];
      else matrix[i][j] = Math.min(matrix[i-1][j-1]+1, matrix[i][j-1]+1, matrix[i-1][j]+1);
    }
  }
  return matrix[b.length][a.length];
}

function findClosestMatch(ingredient) {
  let bestMatch = null, bestDist = Infinity;
  for (const key of DB_KEYS_BY_LENGTH) {
    const dist = levenshteinDistance(ingredient, key);
    if (dist < bestDist) { bestDist = dist; bestMatch = key; }
    if (bestDist === 0) break;
  }
  return [bestMatch, bestDist];
}

// Dairy internal sort: eggs first, then cheese, then sour cream/yogurt, then milks/cream/butter
function getDairyGroup(name) {
  const n = name.toLowerCase();
  if (n.includes('egg')) return 1;
  const cheeses = ['parmesan','parmigiano','pecorino','romano','mozzarella','burrata','feta','cotija',
    'queso','cheddar','jack','gruyere','gruyère','brie','camembert','goat cheese','chèvre','blue cheese',
    'gorgonzola','provolone','fontina','havarti','gouda','halloumi','paneer','ricotta','mascarpone',
    'cream cheese','cottage cheese','cheese'];
  if (cheeses.some(c => n.includes(c))) return 2;
  if (n.includes('sour cream') || n.includes('crème') || n.includes('creme fraiche') || n.includes('yogurt')) return 3;
  return 4;
}

function categorizeIngredient(name) {
  const lower = name.toLowerCase();

  // 1. Direct lookup
  if (INGREDIENT_DB[lower]) return INGREDIENT_DB[lower];

  // 2. Containment match — check if name contains a DB key at word boundaries (longest keys first)
  for (const key of DB_KEYS_BY_LENGTH) {
    const escaped = key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp('(?:^|\\s)' + escaped + '(?:\\s|$)');
    if (re.test(lower)) return INGREDIENT_DB[key];
  }

  // 3. Fuzzy match via Levenshtein (catches typos and minor variants)
  const [match, distance] = findClosestMatch(lower);
  if (distance <= 2) return INGREDIENT_DB[match];

  return 'pantry'; // default
}

const STD_FRACS = [
  {val:0.25,sym:'¼'},{val:1/3,sym:'⅓'},{val:0.5,sym:'½'},
  {val:2/3,sym:'⅔'},{val:0.75,sym:'¾'},
];

// Round decimal fraction to nearest standard fraction if within 8%
function nearestFrac(frac) {
  let best = null, bestDiff = Infinity;
  for (const f of STD_FRACS) {
    const d = Math.abs(frac - f.val);
    if (d < bestDiff) { bestDiff = d; best = f; }
  }
  return (best && frac > 0 && bestDiff / frac <= 0.08) ? best : null;
}

// Format a number using standard fractions (no decimals)
function fmtNum(n) {
  if (!n) return '0';
  const whole = Math.floor(n);
  const frac = parseFloat((n - whole).toFixed(6));
  if (frac < 0.005) return String(whole);
  const f = nearestFrac(frac);
  if (f) return whole > 0 ? `${whole} ${f.sym}` : f.sym;
  const dec = n.toFixed(1);
  return dec.endsWith('.0') ? String(Math.round(n)) : dec;
}

// oz → lb when >= 16 oz; use clean fraction if within 8%, otherwise decimal
function normalizeWeight(qty, unit) {
  if (unit === 'oz' && qty >= 16) {
    const lbs = qty / 16;
    const whole = Math.floor(lbs);
    const frac = parseFloat((lbs - whole).toFixed(6));
    if (frac < 0.005) return { qty: whole, unit: 'lb' };
    const f = nearestFrac(frac);
    if (f) return { qty: whole + f.val, unit: 'lb' };
    return { qty: Math.round(lbs * 10) / 10, unit: 'lb' };
  }
  return { qty, unit };
}

// tsp → tbsp → cup compound display when scaling
function normalizeVolume(qty, unit) {
  if (unit === 'tsp' && qty >= 3) {
    const tbsps = Math.floor(qty / 3);
    const remTsp = Math.round((qty - tbsps * 3) * 10) / 10;
    if (remTsp < 0.05) return [{ qty: tbsps, unit: 'tbsp' }];
    return [{ qty: tbsps, unit: 'tbsp' }, { qty: remTsp, unit: 'tsp' }];
  }
  if (unit === 'tbsp' && qty >= 16) {
    const cups = Math.floor(qty / 16);
    const remTbsp = Math.round((qty - cups * 16) * 10) / 10;
    if (remTbsp < 0.05) return [{ qty: cups, unit: 'cup' }];
    return [{ qty: cups, unit: 'cup' }, { qty: remTbsp, unit: 'tbsp' }];
  }
  // 4+ tbsp → try expressing as clean cup fraction (4tbsp=¼cup, 8tbsp=½cup, etc.)
  if (unit === 'tbsp' && qty >= 4) {
    const cupFrac = qty / 16;
    if (cupFrac < 1) {
      const f = nearestFrac(cupFrac);
      if (f && Math.abs(cupFrac - f.val) / cupFrac <= 0.04) return [{ qty: f.val, unit: 'cup' }];
    }
  }
  return [{ qty, unit }];
}

function parseQty(str) {
  // Normalize unicode fractions
  for(const [k,v] of Object.entries(FRACTION_MAP)) str = str.split(k).join(v);
  str = str.trim();
  // Mixed: "2 1/2" or "1 3/4"
  let m = str.match(/^(\d+)\s+(\d+)\/(\d+)/);
  if(m) return parseInt(m[1]) + parseInt(m[2])/parseInt(m[3]);
  // Simple fraction: "1/2"
  m = str.match(/^(\d+)\/(\d+)/);
  if(m) return parseInt(m[1])/parseInt(m[2]);
  // Range: "2-3" → average
  m = str.match(/^(\d+\.?\d*)\s*[-–]\s*(\d+\.?\d*)/);
  if(m) return (parseFloat(m[1]) + parseFloat(m[2])) / 2;
  // Plain number
  m = str.match(/^(\d+\.?\d*)/);
  if(m) return parseFloat(m[1]);
  return 0;
}

function parseIngredient(raw) {
  if(!raw) return { qty:0, unit:'', name:raw, category:'pantry', raw };
  let str = raw;

  // 0. Decode HTML entities and strip footnote markers
  str = str
    .replace(/\xa0/g, ' ')
    .replace(/&amp;/g, '&')
    .replace(/&#(?:39|8217|8216|x27);|&apos;/gi, "'")
    .replace(/&#(?:8220|8221|8243);|&quot;/gi, '"')
    .replace(/&#8211;/g, '-').replace(/&#8212;/g, ' - ')
    .replace(/&frac14;/g, '¼').replace(/&frac12;/g, '½').replace(/&frac34;/g, '¾')
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/&#\d+;/g, '').replace(/&[a-z]+;/gi, '')
    .replace(/\*/g, '')                   // all asterisks (footnote markers)
    .replace(/\s*\(\*[^)]*\)/g, '')      // (*Note 1) style inline footnotes
    .trim();

  // 1. Normalize unicode fractions
  for(const [k,v] of Object.entries(FRACTION_MAP)) str = str.split(k).join(v);
  str = str.trim();

  // 2. Strip long cooking notes in parens (15+ chars) — keep short ones like "(6 oz)" or "(optional)"
  str = str.replace(/\(\([^)]*\)\)/g, '').replace(/\([^)]{15,}\)/g, '').replace(/\(Note\s*\d*\)/gi, '').trim();

  // 3. Vague quantities — return early with no scalable number
  const strLower = str.toLowerCase();
  for (const vague of VAGUE_WORDS) {
    if (strLower.startsWith(vague)) {
      const vagueNameStr = str.slice(vague.length).replace(/^[,\s:]+/, '').trim();
      const vagueName = vagueNameStr.replace(/\(.*?\)/g,'').replace(/,.*$/,'').trim().toLowerCase();
      return { qty: 0, unit: '', name: vagueName || strLower, category: categorizeIngredient(vagueName || strLower), raw };
    }
  }

  // 4. Text numbers: "One lemon" → qty=1, "Half cup" → qty=0.5
  const textNumM = str.match(/^(one|two|three|four|five|six|seven|eight|nine|ten|half)\s+/i);
  let qty = 0;
  if (textNumM) {
    qty = TEXT_NUMBERS[textNumM[1].toLowerCase()] || 0;
    str = str.slice(textNumM[0].length).trim();
  }

  // 5. "N x" or "N ×" piece-count prefix (e.g. "4 x 6oz salmon fillets")
  let pieceCount = 0;
  if (!qty) {
    const piecePrefixM = str.match(/^(\d+)\s*[xX×]\s+/);
    if (piecePrefixM) {
      pieceCount = parseInt(piecePrefixM[1]);
      str = str.slice(piecePrefixM[0].length).trim();
    }
  }

  // 6. Strip dual metric/imperial — keep only the imperial part
  // "200g / 7 oz" → "7 oz", "180g/6 oz" → "6 oz"
  str = str.replace(/\d+\.?\d*\s*(?:g|kg|ml|l)\s*[\/|]\s*/gi, '');

  // 7. Pre-normalize "zest/juice/peel of/from N ingredient" → "N ingredient zest/juice/peel"
  //    Handles whole numbers, decimals, fractions (1/2), mixed numbers (1 1/2), and words
  str = str.replace(/^(zest|juice|peel|rind)\s+(?:of|from)\s+((?:\d+\s+)?\d+\/\d+|\d+\.?\d*|one|two|three|four|five|six|seven|eight|nine|ten|half|a|an)\s+(.+)$/i,
    (_, prep, num, ing) => {
      const n = TEXT_NUMBERS[num.toLowerCase()] != null ? TEXT_NUMBERS[num.toLowerCase()] : num;
      return `${n} ${ing.trim()} ${prep.toLowerCase()}`;
    });

  // 8. Extract leading quantity (if not already set by text number)
  const qtyPat = /^((?:\d+\s+)?\d+\/\d+|\d+\.?\d*(?:\s*[-–]\s*\d+\.?\d*)?)/;
  if (!qty) {
    const qtyM = str.match(qtyPat);
    if(qtyM) { qty = parseQty(qtyM[1]); str = str.slice(qtyM[0].length).trim(); }
  }

  // 8b. Strip "to N [unit]" range upper-bound — use the lower value already captured
  //     e.g. "1/2 to 1 teaspoon" → "teaspoon", "1 to 2 green chili" → "green chili"
  if (qty > 0) {
    str = str.replace(/^to\s+(?:(?:\d+\s+)?\d+(?:\/\d+)?|\d+\.?\d*)\s*/i, '').trim();
  }

  // 9. Compact inline measure right after a leading count — "1 6oz. can" → 6oz
  // Only when no unit has been identified yet (unit is still '')
  let unit = '';
  const compactMeasurePat = /^(\d+\.?\d*)\s*(oz\.?|fl oz|lb\.?|lbs?\.?|g|kg|ml|l)\b/i;
  const compactM = !unit ? str.match(compactMeasurePat) : null;
  if(compactM) {
    const cQty = parseQty(compactM[1]);
    const cUnitRaw = compactM[2].replace(/\.$/, '').trim().toLowerCase();
    unit = UNITS[cUnitRaw] || cUnitRaw;
    qty = (qty || 1) * cQty;
    str = str.slice(compactM[0].length).replace(/^[.\s]+/, '').trim();
  }

  // 10. Extract unit (try longest match first)
  if (!unit) {
    const unitKeys = Object.keys(UNITS).sort((a,b)=>b.length-a.length);
    for(const uk of unitKeys) {
      const pat = new RegExp('^'+uk.replace(/\./g,'\\.')+'(?:\\b|\\s|,|\\.|$)','i');
      if(pat.test(str)) {
        unit = UNITS[uk];
        str = str.slice(uk.length).replace(/^[.\s]+/, '').trim();
        if(str.startsWith('of ')) str = str.slice(3).trim();
        break;
      }
    }
  }

  // 11. Strip duplicate qty+unit left in str after extraction
  //     e.g. "1 1/2 lb 1.5 lb skinless salmon" → after extracting "1 1/2 lb", strip "1.5 lb"
  if (unit) {
    str = str.replace(/^\d+\.?\d*\s*(?:oz\.?|lbs?\.?|lb\.?|g|kg|ml|l|cups?|tbsps?|tsps?)\s*/i, '').trim();
  }

  // 12. Convert metric units to imperial
  if (unit === 'g')  { qty = Math.round(qty * 0.03527 * 100) / 100; unit = 'oz'; }
  if (unit === 'kg') { qty = Math.round(qty * 2.20462 * 100) / 100; unit = 'lb'; }
  if (unit === 'ml') { qty = Math.round(qty * 0.033814 * 100) / 100; unit = 'oz'; }
  if (unit === 'l')  { qty = Math.round(qty * 33.814 * 100) / 100; unit = 'oz'; }

  // 13. Category lookup from pre-cleaned name
  const preCleanLower = str.toLowerCase()
    .replace(/\(.*?\)/g,'').replace(/\).*$/,'').replace(/,.*$/,'').trim();
  let forcedCategory = INGREDIENT_DB[preCleanLower] || null;
  if (!forcedCategory) {
    for (const key of DB_KEYS_BY_LENGTH) {
      const escaped = key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp('(?:^|\\s)' + escaped + '(?:\\s|$)');
      if (re.test(preCleanLower)) { forcedCategory = INGREDIENT_DB[key]; break; }
    }
  }

  // 13b. Strip "plus more if needed/necessary" qualifiers so variants aggregate together
  str = str.replace(/,?\s*plus more\b.*/i, '').trim();

  // 14. Smart comma: if everything after the first comma is stop words → strip;
  //     otherwise replace comma with space to preserve descriptors like "skinless, boneless"
  const commaIdx = str.indexOf(',');
  if (commaIdx >= 0) {
    const afterComma = str.slice(commaIdx + 1).trim();
    const afterWords = afterComma.split(/\s+/).filter(w => w.length > 0);
    const allStop = afterWords.length > 0 && afterWords.every(w =>
      STOP_WORDS.includes(w.toLowerCase().replace(/[.,!?]$/, ''))
    );
    str = allStop ? str.slice(0, commaIdx).trim() : str.replace(/,\s*/g, ' ').trim();
  }

  // 15. Clean name
  let name = str
    .replace(/\(.*?\)/g,'')
    .replace(/\).*$/,'')
    // Fallback for "juice/zest of lemon" with no number, or leftover after step 7 failed
    .replace(/^juice (?:of|from)\s+(?:(?:\d+\s+)?\d+(?:\/\d+)?|\d+\.?\d*)?\s*/i, '')
    .replace(/^zest (?:of|from)\s+(?:(?:\d+\s+)?\d+(?:\/\d+)?|\d+\.?\d*)?\s*/i, '')
    .split(/\s+/)
    .filter(w => !STOP_WORDS.includes(w.toLowerCase()))
    .join(' ')
    .trim()
    .replace(/\s+/g,' ')
    .toLowerCase();

  name = name.replace(/^(of|a|an|the)\s+/, '');

  if (name.includes(' or ')) {
    const parts = name.split(' or ');
    name = parts.find(p => INGREDIENT_DB[p.trim()]) || parts[0].trim();
  }

  // 16. Apply piece-count logic: if "N x" prefix was found, count is scalable; per-piece weight → descriptor
  if (pieceCount > 0) {
    const nameWords = name.split(' ');
    if (nameWords.some(w => PIECE_WORDS.has(w))) {
      const perPiece = (qty && unit) ? `${fmtNum(qty)} ${unit} ` : '';
      const category2 = forcedCategory || categorizeIngredient(name || raw);
      name = (perPiece + name).trim();
      return { qty: pieceCount, unit: '', name: INGREDIENT_ALIASES[name] || name, category: category2, raw };
    }
  }

  // 17. Special cases & alias map
  if (unit === 'clove' && !name) name = 'garlic'; // "2 cloves ((optional))" → garlic cloves
  if (unit === 'clove' && (name === 'garlic' || name === 'garlic cloves')) { name = 'garlic cloves'; unit = ''; }
  if (unit === 'head'  && name === 'garlic') { name = 'garlic (whole head)'; unit = ''; }
  // Garlic measured in tsp/tbsp (minced) → convert to clove-equivalent so it aggregates cleanly
  if ((unit === 'tsp' || unit === 'tbsp') && (name === 'garlic' || name === 'garlic cloves')) {
    qty = Math.round((unit === 'tbsp' ? qty * 3 : qty) * 10) / 10;
    unit = '';
    name = 'garlic cloves';
  }
  // Fresh ginger in inches → convert to tsp (1 inch microplaned ≈ 1 tsp) so all ginger aggregates
  if (unit === 'inch' && (name === 'ginger' || name === 'fresh ginger')) { unit = 'tbsp'; name = 'ginger'; }
  name = INGREDIENT_ALIASES[name] || name;

  const category = forcedCategory || categorizeIngredient(name || raw);
  return { qty, unit, name: name || raw.toLowerCase(), category, raw };
}

// category param: pass entry.category so oz→lb only fires for solid/protein items
function fmtQty(qty, unit, category) {
  if(!qty) return unit || '';
  // oz → lb only for solid items (protein, produce) — not liquids like broth, oil, cream
  const solidCategories = new Set(['protein','produce','meat','seafood','frozen']);
  if (unit === 'lb' || (unit === 'oz' && solidCategories.has(category))) {
    const n = normalizeWeight(qty, unit);
    return `${fmtNum(n.qty)} ${n.unit}`;
  }
  // Volume: compound display (1 cup + 2 tbsp)
  if (unit === 'tsp' || unit === 'tbsp') {
    const parts = normalizeVolume(qty, unit);
    return parts.map(p => `${fmtNum(p.qty)} ${p.unit}`).join(' + ');
  }
  return unit ? `${fmtNum(qty)} ${unit}` : fmtNum(qty);
}

// ─────────────────────────────────────────────
// Ingredient audit — call auditIngredients() from browser console
// Downloads a CSV of ingredients the parser flagged as uncertain
// ─────────────────────────────────────────────
function auditIngredients() {
  const issues = [];
  for (const recipe of allRecipes) {
    const ings = ingredients[recipe.name] || [];
    for (const raw of ings) {
      const p = parseIngredient(raw);
      const flags = [];
      if (/\d/.test(p.name)) flags.push('number in name');
      if (/\b(?:g|kg|ml)\b/.test(p.name)) flags.push('metric in name');
      if (p.name.length < 2 && raw.length > 3) flags.push('name too short');
      if (p.qty && !p.unit && p.name && !p.name.split(' ').some(w => PIECE_WORDS.has(w))) {
        flags.push('qty without unit');
      }
      if (flags.length) {
        issues.push({ recipe: recipe.name, raw, qty: p.qty, unit: p.unit, name: p.name, flags: flags.join('; ') });
      }
    }
  }
  const header = 'Recipe,Raw Ingredient,Parsed Qty,Parsed Unit,Parsed Name,Issues';
  const rows = issues.map(i =>
    [i.recipe, i.raw, i.qty, i.unit, i.name, i.flags]
    .map(c => `"${String(c||'').replace(/"/g,'""')}"`)
    .join(',')
  );
  const csv = [header, ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'ingredient_audit.csv'; a.click();
  URL.revokeObjectURL(url);
  console.log(`Audit: ${issues.length} flagged ingredients`);
  return issues.length;
}
window.auditIngredients = auditIngredients;

// Aggregate ingredients from all menu recipes
function aggregateIngredients() {
  // Map: canonical name → { qty by unit, sources, category, raw examples }
  const map = new Map();

  for(const {recipe, servings} of menuItems) {
    const ings = ingredients[recipe.name] || [];
    for(const raw of ings) {
      const p = parseIngredient(raw);
      if(!p.name || p.name.length < 2) continue;

      // Create key: normalize name
      const key = p.name.replace(/\s+/g,' ').trim();
      if(!map.has(key)) {
        map.set(key, { name: key, category: p.category, unitQtys: {}, sources: [], raws:[] });
      }
      const entry = map.get(key);
      const u = p.unit || 'count';
      entry.unitQtys[u] = (entry.unitQtys[u] || 0) + p.qty * servings;
      if(!entry.sources.includes(recipe.name)) entry.sources.push(recipe.name);
      if(entry.raws.length < 3) entry.raws.push(raw);
    }
  }

  return map;
}

function buildShoppingList() {
  const listEl = document.getElementById('shopping-list');

  if(menuItems.length === 0) {
    listEl.innerHTML = `<div class="list-empty">
      <div class="list-empty-icon">🛒</div>
      <div class="list-empty-text">Add recipes to your menu<br>to generate a shopping list</div>
    </div>`;
    return;
  }

  // Show "no ingredients" banner if data missing
  const missingIngredients = menuItems.filter(m => !ingredients[m.recipe.name] || !ingredients[m.recipe.name].length);
  let html = '';

  if(!hasIngredients) {
    html += `<div class="no-data-banner">
      <span class="icon"></span>
      <p>Ingredient data hasn't been generated yet. Run <code>python3 scrape_ingredients.py</code> once to scrape all recipe pages, then refresh. Recipes from blogs that don't provide JSON-LD (Half Baked Harvest, etc.) will show a link to the original recipe instead.</p>
    </div>`;
  } else if(missingIngredients.length > 0) {
    html += `<div class="no-data-banner">
      <span class="icon"></span>
      <p>${missingIngredients.length} recipe${missingIngredients.length>1?'s':''} don't have ingredient data (blog may use JavaScript rendering): ${missingIngredients.map(m=>`<b>${m.recipe.name}</b>`).join(', ')}. Visit the original recipe for their ingredients.</p>
    </div>`;
  }

  // Build category sections
  const aggregated = aggregateIngredients();
  const swapMap = buildSwapMap(activeDietToken);
  const color = activeDietToken ? (DIET_COLORS[activeDietToken] || 'var(--accent)') : 'var(--accent)';

  const byCat = {};
  for(const cat of CATEGORIES) byCat[cat.key] = [];

  for(const [key, entry] of aggregated) {
    const cat = entry.category in byCat ? entry.category : 'pantry-staples';
    byCat[cat].push(entry);
  }

  const UNIT_DISPLAY_ORDER = {count:0,lb:1,oz:2,cup:3,tbsp:4,tsp:5,qt:6,pt:7,clove:8,head:9,inch:10,dash:11};

  function fmtEntry(entry) {
    const parts = Object.entries(entry.unitQtys)
      .filter(([u, q]) => q > 0)
      .sort(([a],[b]) => (UNIT_DISPLAY_ORDER[a]??99) - (UNIT_DISPLAY_ORDER[b]??99))
      .map(([u, q]) => u === 'count' ? fmtQty(q,'') : fmtQty(q, u, entry.category));
    return parts.join(' + ');
  }

  for(const cat of CATEGORIES) {
    const items = byCat[cat.key];
    if(!items || items.length === 0) continue;

    if (cat.key === 'dairy') {
      items.sort((a,b) => {
        const ga = getDairyGroup(a.name), gb = getDairyGroup(b.name);
        return ga !== gb ? ga - gb : a.name.localeCompare(b.name);
      });
    } else {
      items.sort((a,b) => a.name.localeCompare(b.name));
    }

    // Build rows with swap logic
    const rows = [];
    for (const entry of items) {
      const swapInfo = swapMap.get(entry.name);
      if (swapInfo) {
        if (swapInfo.to) {
          // Show swap replacement row instead
          rows.push({ type: 'swap', swapName: swapInfo.to, original: entry.name, recipe: swapInfo.recipe, entry });
        } else {
          // Ingredient removed — crossed out
          rows.push({ type: 'crossed', entry, recipe: swapInfo.recipe });
        }
      } else {
        rows.push({ type: 'normal', entry });
      }
    }

    if (rows.length === 0) continue;

    html += `<div class="cat-section">
      <div class="cat-header">
        <span class="cat-icon">${cat.icon}</span>
        <span class="cat-name">${cat.label}</span>
        <span class="cat-badge">${rows.length}</span>
      </div>
      <div class="cat-items">`;

    for(const row of rows) {
      if (row.type === 'swap') {
        html += `<div class="shop-item swap-row" style="cursor:default">
          <div class="item-check" style="border-color:${color};color:${color}">↑</div>
          <div class="item-body">
            <span class="item-name" style="color:${color}">${esc(capFirst(row.swapName))}</span>
            <div class="swap-note">${esc(activeDietToken)} swap · replaces ${esc(row.original)} · ${esc(row.recipe)}</div>
          </div>
          <span class="swap-badge" style="color:${color};border-color:${color}44">✓ ${esc(activeDietToken)}</span>
        </div>`;
        continue;
      }
      if (row.type === 'crossed') {
        const qtyStr = fmtEntry(row.entry);
        html += `<div class="shop-item crossed-row" style="cursor:default">
          <div class="item-check" style="border-color:var(--red);color:var(--red)">✕</div>
          <div class="item-body">
            <span class="item-qty" style="text-decoration:line-through;color:var(--red)">${qtyStr}</span>
            <span class="item-name">${esc(capFirst(row.entry.name))}</span>
            <div class="swap-note">remove for ${esc(activeDietToken)} · ${esc(row.recipe)}</div>
          </div>
        </div>`;
        continue;
      }
      // Normal
      const itemKey = row.entry.name;
      const isChecked = checkedItems.has(itemKey);
      if(hideChecked && isChecked) continue;
      const qtyStr = fmtEntry(row.entry);
      html += `<div class="shop-item ${isChecked ? 'checked' : ''}" data-key="${esc(itemKey)}">
        <div class="item-check">${isChecked ? '✓' : ''}</div>
        <div class="item-body">
          <span class="item-qty">${qtyStr}</span>
          <span class="item-name">${esc(capFirst(row.entry.name))}</span>
        </div>
      </div>`;
    }

    html += `</div></div>`;
  }

  // Recipes with no ingredient data — show links
  if(missingIngredients.length > 0 && hasIngredients) {
    html += `<div class="cat-section">
      <div class="cat-header"><span class="cat-icon"></span><span class="cat-name">Visit Original Recipes</span></div>
      <div class="cat-items">`;
    for(const {recipe} of missingIngredients) {
      if(recipe.url) {
        html += `<div class="shop-item" style="cursor:default">
          <div class="item-check"></div>
          <div class="item-body">
            <span class="item-name"><a href="${esc(recipe.url)}" target="_blank" style="color:var(--accent)">${esc(recipe.name)}</a></span>
            <div class="item-sources">Ingredient list available on the original blog post</div>
          </div>
        </div>`;
      }
    }
    html += `</div></div>`;
  }

  listEl.innerHTML = html;

  // Event delegation for check-off items
  listEl.onclick = e => {
    const item = e.target.closest('.shop-item');
    if(item && item.dataset.key) toggleCheck(item.dataset.key);
  };
}

// ─────────────────────────────────────────────
// Interactions
// ─────────────────────────────────────────────
function toggleCheck(key) {
  if(checkedItems.has(key)) checkedItems.delete(key);
  else checkedItems.add(key);
  saveMenu();
  buildShoppingList();
}

function toggleChecked() {
  hideChecked = !hideChecked;
  const btn = document.querySelector('#list-actions button');
  btn.textContent = hideChecked ? 'Show all' : 'Hide checked';
  buildShoppingList();
}

function uncheckAll() {
  checkedItems.clear();
  saveMenu();
  buildShoppingList();
}

function copyList() {
  if(menuItems.length === 0) return;
  const aggregated = aggregateIngredients();
  const lines = [`CKC Shopping List — ${menuItems.map(m=>m.recipe.name).join(', ')}`, ''];

  for(const cat of CATEGORIES) {
    const items = [...aggregated.values()].filter(e => (e.category === cat.key) || (cat.key === 'pantry-staples' && !CATEGORIES.find(c=>c.key===e.category))).sort((a,b)=>a.name.localeCompare(b.name));
    if(items.length === 0) continue;
    lines.push(`${cat.label.toUpperCase()}`);
    for(const entry of items) {
      const qtyParts = Object.entries(entry.unitQtys).filter(([u,q])=>q>0).map(([u,q])=>u==='count'?fmtQty(q,''):fmtQty(q,u));
      lines.push(`  □ ${qtyParts.join(' + ')} ${capFirst(entry.name)}`);
    }
    lines.push('');
  }

  navigator.clipboard.writeText(lines.join('\n')).then(()=>{
    const btn = [...document.querySelectorAll('.action-btn')].find(b=>b.textContent.includes('Copy'));
    const orig = btn.textContent;
    btn.textContent = '✓ Copied!';
    setTimeout(()=>btn.textContent=orig, 2000);
  });
}

function printList() {
  window.print();
}

// ─────────────────────────────────────────────
// Persistence
// ─────────────────────────────────────────────
function saveMenu() {
  const data = {
    menu: menuItems.map(m => ({ name: m.recipe.name, servings: m.servings })),
    checked: [...checkedItems],
  };
  localStorage.setItem('ckc_menu', JSON.stringify(data));
}

function restoreMenu() {
  const raw = localStorage.getItem('ckc_menu');
  if(!raw) return;
  try {
    const data = JSON.parse(raw);
    menuItems = (data.menu || []).map(m => {
      const recipe = allRecipes.find(r => r.name === m.name);
      return recipe ? { recipe, servings: m.servings || 1 } : null;
    }).filter(Boolean);
    checkedItems = new Set(data.checked || []);
    updateMenuStrip();
    buildShoppingList();
    filterRecipes();
  } catch(e) {}
}

// ─────────────────────────────────────────────
// Helpers
// ─────────────────────────────────────────────
function esc(s) {
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function capFirst(s) {
  if(!s) return '';
  return s[0].toUpperCase() + s.slice(1);
}

function shortenTitle(t) {
  return t.length > 30 ? t.slice(0,28)+'…' : t;
}

// ─────────────────────────────────────────────
// Diet test tokens
// ─────────────────────────────────────────────
let activeDietToken = null;

// ─────────────────────────────────────────────
// Swap logic (mirrors consumer ShopScreen)
// ─────────────────────────────────────────────

function parseSwapPairs(notes) {
  const result = [];
  const s = notes.toLowerCase();
  const insteadRe = /use\s+(.+?)\s+instead\s+of\s+(.+?)(?:[,.]|$)/gi;
  let m;
  while ((m = insteadRe.exec(s)) !== null) result.push({ from: m[2].trim(), to: m[1].trim() });
  const replaceRe = /replace\s+(.+?)\s+with\s+(.+?)(?:[,.]|$)/gi;
  while ((m = replaceRe.exec(s)) !== null) {
    const to = m[2].trim();
    m[1].split(/\s+and\s+/i).forEach(f => result.push({ from: f.trim(), to }));
  }
  const skipRe = /(?:skip|omit)\s+([^,.\n]+)/gi;
  while ((m = skipRe.exec(s)) !== null) result.push({ from: m[1].split(',')[0].trim(), to: null });
  return result;
}

function fuzzyMatch(parsedTerm, ingredientName) {
  const clean = x => x.replace(/\b(cloves?|heads?|tbsp\s+of|tsp\s+of|cups?\s+of|\bof\b)\b/g, '').replace(/\s+/g, ' ').trim();
  const a = clean(parsedTerm), b = clean(ingredientName);
  return b.includes(a) || a.includes(b);
}

function buildSwapMap(dietKey) {
  if (!dietKey) return new Map();
  const aggregated = aggregateIngredients();
  const map = new Map();
  for (const m of menuItems) {
    const recipe = m.recipe;
    const tag = recipe.dietTags && recipe.dietTags[dietKey];
    if (!tag || tag.native || !tag.mod || !(tag.notes || '').trim()) continue;
    const pairs = parseSwapPairs(tag.notes);
    for (const pair of pairs) {
      for (const ingName of aggregated.keys()) {
        if (!map.has(ingName) && fuzzyMatch(pair.from, ingName)) {
          map.set(ingName, { to: pair.to, recipe: recipe.name, protocol: dietKey });
        }
      }
    }
  }
  return map;
}

function applyDietTokenStyles() {
  document.querySelectorAll('.diet-token').forEach(btn => {
    const isActive = btn.dataset.diet === activeDietToken;
    const color = btn.dataset.color || '#fff';
    btn.classList.toggle('active', isActive);
    btn.style.background = isActive ? color : '';
  });
}

function toggleDietToken(key) {
  activeDietToken = activeDietToken === key ? null : key;
  applyDietTokenStyles();
  const sel = document.getElementById('filter-diet');
  if (sel) { sel.value = activeDietToken || ''; filterRecipes(); }
  updateMenuStrip();
  buildShoppingList();
}

function clearDietToken() {
  activeDietToken = null;
  applyDietTokenStyles();
  const sel = document.getElementById('filter-diet');
  if (sel) { sel.value = ''; filterRecipes(); }
  updateMenuStrip();
  buildShoppingList();
}

function getCompliance(recipe, dietKey) {
  if (!dietKey || !recipe.dietTags) return null;
  const tag = recipe.dietTags[dietKey];
  if (!tag) return 'none';
  if (tag.native) return 'native';
  if (tag.mod)    return 'mod';
  return 'none';
}
